name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version:
          - "30.1"
          - "snapshot"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Byte-compile all modules
        run: |
          emacs --batch -Q -L . -f batch-byte-compile *.el

      - name: Run ERT unit test suite
        run: |
          emacs --batch -Q -L . -l tests/test-jot.el -f ert-run-tests-batch-and-exit
